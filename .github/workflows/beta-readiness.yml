name: NOAH ARK beta readiness

# Tests only — no production deployments, production DB migrations or paid APIs.
on:
  push:
    branches:
      - chatgpt/noah-free-beta-readiness
      - chatgpt/noah-source-discovery
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate mock runtime and protected HTTP routes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEWS_PROVIDER: mock
      AI_PROVIDER: mock
      DB_MODE: local
      DATABASE_URL: postgresql://noah:noah@127.0.0.1:5432/noah
      LOCAL_DATABASE_URL: file:.noah/beta-ci.db
      APP_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10"
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install locked dependencies and generate Prisma clients
        run: pnpm install --frozen-lockfile

      - name: Create isolated synthetic SQLite dataset
        run: pnpm setup:mock

      - name: Check types
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Production build
        run: pnpm build

      - name: Mock/live HTTP boundary tests
        run: pnpm test:http

      - name: Confirm no deployment occurs from this workflow
        run: echo "Validation only; no publish, Vercel writes, paid AI calls or production DB access."

  postgres-schema:
    name: Verify Prisma migration against disposable Postgres 17
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: noah_beta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d noah_beta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/noah_beta?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10"
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies and generate Prisma clients
        run: pnpm install --frozen-lockfile

      - name: Apply committed Prisma migration to disposable database
        run: pnpm exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Confirm migration is recorded and database is in sync
        run: pnpm exec prisma migrate status --schema prisma/schema.prisma

      - name: Verify migration is idempotent
        run: pnpm exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Do not touch production Neon
        run: echo "Disposable Docker Postgres only; no Neon credentials, no real-news or paid API calls."
