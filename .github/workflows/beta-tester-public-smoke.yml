name: NOAH ARK beta tester public URL smoke
on:
  push:
    branches:
      - chatgpt/noah-public-smoke
  workflow_dispatch:
permissions:
  contents: read
jobs:
  beta-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify publicly shareable tester page and existing Home
        shell: bash
        run: |
          set -euo pipefail
          root="https://noah-ark-ai.vercel.app"
          for attempt in 1 2 3; do
            status=$(curl --retry 2 --retry-all-errors -LsS --max-time 90 -o /tmp/noah-beta.html -w '%{http_code}' "$root/beta" || true)
            if [[ "$status" == "200" ]] && grep -q "베타테스트에 초대합니다" /tmp/noah-beta.html &&
                 grep -q "TEST CHECKLIST" /tmp/noah-beta.html &&
                 grep -q "피드백 공유하기" /tmp/noah-beta.html &&
                 grep -q 'noindex, nofollow' /tmp/noah-beta.html; then
              echo "PASS beta invite HTTP 200, five missions, feedback share and noindex"
              break
            fi
            echo "Attempt $attempt: HTTP $status or tester page missing"
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep 8
          done
          status=$(curl -LsS --max-time 90 -o /tmp/noah-home.html -w '%{http_code}' "$root/")
          [[ "$status" == "200" ]] || { echo "FAIL Home HTTP $status"; exit 1; }
          grep -q "실제 정부 RSS" /tmp/noah-home.html || { echo "FAIL genuine source mode"; exit 1; }
          grep -q "https://www.mss.go.kr/" /tmp/noah-home.html || { echo "FAIL no real official links"; exit 1; }
          if grep -q "가상 Event로 동작을 확인하는 화면" /tmp/noah-home.html; then
            echo "FAIL demo leaked to public service"; exit 1
          fi
          status=$(curl -LsS --max-time 60 -o /tmp/noah-edition.json -w '%{http_code}' "$root/api/ark")
          [[ "$status" == "200" ]] && grep -q '"mode":"live"' /tmp/noah-edition.json && grep -q '"items":\[\]' /tmp/noah-edition.json || {
            echo "FAIL live mode still must not invent analyzed Events"; exit 1;
          }
          echo "PASS original source Home remains available, no fabricated Event or accidental login restriction"
