name: NOAH AI News Partner onboarding review

on:
  push:
    branches:
      - chatgpt/noah-ai-news-partner-onboarding-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noah-onboarding-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEWS_PROVIDER: mock
      AI_PROVIDER: mock
      DB_MODE: local
      DATABASE_URL: postgresql://invalid:invalid@127.0.0.1:5433/never_connect
      LOCAL_DATABASE_URL: file:.noah/reader-onboarding-ci.db
      NOAH_LIVE_LINKS_V1: "false"
      SOURCE_LINKS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare isolated synthetic data
        run: pnpm setup:mock
      - name: Typecheck
        run: pnpm typecheck
      - name: Regression and onboarding tests
        run: pnpm test
      - name: ESLint
        run: pnpm lint
      - name: Build with no external news or AI calls
        run: pnpm build
      - name: Existing no-browser HTTP acceptance tests
        run: pnpm test:http
