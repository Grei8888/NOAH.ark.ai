name: NOAH Housing review checks

on:
  pull_request:
    paths:
      - 'products/noah-housing/**'
      - '.github/workflows/noah-housing-review.yml'
  push:
    branches:
      - 'chatgpt/noah-housing-intelligence-v1'
    paths:
      - 'products/noah-housing/**'
      - '.github/workflows/noah-housing-review.yml'

permissions:
  contents: read

jobs:
  independent-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: products/noah-housing
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install standalone app
        run: npm install --no-audit --no-fund
      - name: Verify arithmetic and HOME:LINK contract
        run: npm test
      - name: Build independent Next app
        run: npm run build
