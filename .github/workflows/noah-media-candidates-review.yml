name: NOAH ARK candidate-source review (no live feeds)

on:
  push:
    branches:
      - chatgpt/noah-multi-source-registry-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noah-source-candidates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Local mock-only regression and release gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEWS_PROVIDER: mock
      AI_PROVIDER: mock
      DB_MODE: local
      DATABASE_URL: postgresql://invalid:invalid@127.0.0.1:5433/never_connect
      LOCAL_DATABASE_URL: file:.noah/source-candidates-ci.db
      NOAH_LIVE_LINKS_V1: "false"
      SOURCE_LINKS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies (lockfile only)
        run: pnpm install --frozen-lockfile
      - name: Prepare offline synthetic database
        run: pnpm setup:mock
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Production-mode build with no live sources
        run: pnpm build
      - name: Assert no live-feed or paid API execution
        run: echo "No publisher RSS GET, paid AI, production DB or deployment was performed."
