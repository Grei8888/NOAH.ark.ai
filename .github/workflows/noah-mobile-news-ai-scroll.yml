name: NOAH Mobile News to AI Scroll Review

on:
  push:
    branches:
      - chatgpt/noah-mobile-ai-scroll-v1
  pull_request:
    branches:
      - chatgpt/noah-business-support-data-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noah-mobile-news-scroll-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEWS_PROVIDER: mock
      AI_PROVIDER: mock
      DB_MODE: local
      DATABASE_URL: postgresql://invalid:invalid@127.0.0.1:5433/never_connect
      LOCAL_DATABASE_URL: file:.noah/mobile-scroll-ci.db
      NOAH_LIVE_LINKS_V1: "false"
      NOAH_REAL_SOURCE_PREVIEW: "false"
      NOAH_READER_LAB_ENABLED: "false"
      NOAH_NEWS_SEARCH_ENABLED: "false"
      NOAH_BUSINESS_SUPPORT_ENABLED: "false"
      SOURCE_LINKS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Isolated test data
        run: pnpm setup:mock
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and mobile target regression
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Production-style build
        run: pnpm build
      - name: API regressions
        run: pnpm test:http
