name: NOAH Public Opportunities Review

on:
  push:
    branches:
      - chatgpt/noah-public-opportunities-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEWS_PROVIDER: mock
      AI_PROVIDER: mock
      DB_MODE: local
      DATABASE_URL: postgresql://invalid:invalid@127.0.0.1:5433/never_connect
      LOCAL_DATABASE_URL: file:.noah/public-opportunities-ci.db
      NOAH_LIVE_LINKS_V1: "false"
      NOAH_REAL_SOURCE_PREVIEW: "false"
      NOAH_NEWS_SEARCH_ENABLED: "false"
      NOAH_BUSINESS_SUPPORT_ENABLED: "false"
      NOAH_B2G_ENABLED: "false"
      SOURCE_LINKS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare isolated test data
        run: pnpm setup:mock
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and classification regressions
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Next production build
        run: pnpm build
      - name: HTTP regressions
        run: pnpm test:http
