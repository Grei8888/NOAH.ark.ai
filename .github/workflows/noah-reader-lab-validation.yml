name: NOAH private AI Reading Companion lab

on:
  push:
    branches:
      - chatgpt/noah-ai-reading-companion-lab-v1
  pull_request:
    branches:
      - chatgpt/noah-ai-news-partner-onboarding-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noah-private-reader-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mock-only-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEWS_PROVIDER: mock
      AI_PROVIDER: mock
      DB_MODE: local
      DATABASE_URL: postgresql://invalid:invalid@127.0.0.1:5433/never_connect
      LOCAL_DATABASE_URL: file:.noah/ai-reader-lab-ci.db
      NOAH_LIVE_LINKS_V1: "false"
      NOAH_READER_LAB_ENABLED: "false"
      SOURCE_LINKS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Locked install
        run: pnpm install --frozen-lockfile
      - name: Isolated synthetic data
        run: pnpm setup:mock
      - name: Static typecheck
        run: pnpm typecheck
      - name: Unit and API authorization tests (provider request mocked)
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Build with AI lab disabled
        run: pnpm build
      - name: Existing route HTTP regressions
        run: pnpm test:http
