name: NOAH rights-safe cover cards

on:
  push:
    branches:
      - chatgpt/noah-safe-visual-cards
      - chatgpt/noah-card-ratio-refine
      - chatgpt/noah-today-interests-v1
      - chatgpt/noah-manual-source-refresh-v1
      - chatgpt/noah-inline-refresh-feedback
      - chatgpt/noah-beta-feedback-sheet-direct
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noah-safe-covers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Existing app and image-permission regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEWS_PROVIDER: mock
      AI_PROVIDER: mock
      NOAH_LIVE_LINKS_V1: "false"
      DB_MODE: local
      DATABASE_URL: postgresql://invalid:invalid@127.0.0.1:5433/never_connect
      LOCAL_DATABASE_URL: file:.noah/covers-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:mock
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:http

  live:
    name: Official RSS cards show owned covers with no external pictures
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      VERCEL_ENV: production
      NOAH_LIVE_LINKS_V1: "true"
      NEWS_PROVIDER: government
      AI_PROVIDER: "off"
      DB_MODE: postgres
      DATABASE_URL: postgresql://invalid:invalid@127.0.0.1:5433/never_connect
      SOURCE_LINKS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start production-mode local Next.js
        run: |
          node node_modules/next/dist/bin/next start -H 127.0.0.1 -p 3110 >/tmp/noah-safe-cards.log 2>&1 &
          echo $! >/tmp/noah-safe-cards.pid
      - name: Check live original-source HTML (no DB, paid AI, photos or fake Events)
        run: |
          node --import tsx scripts/verify-public-source-beta.ts
          node --input-type=module -e '
            const html=await (await fetch("http://127.0.0.1:3110")).text();
            if (!html.includes("sourceVisualLink") || !html.includes("noahCardImage--cover") || !html.includes("noahCardImageArt")) throw Error("Safe NOAH cover missing");
            if (html.includes("noahCardImage--photo")) throw Error("Unreviewed publisher photo was displayed");
            if (!html.includes("https://www.mss.go.kr/")) throw Error("Real official source not linked");
            if (!html.includes("오늘의 관심사") || !html.includes("AI·기술") || !html.includes("정책·제도")) throw Error("Daily interest quick filters missing from server-rendered Home");
            if (!html.includes("최신 자료 확인") || !html.includes("sourceRefreshButton")) throw Error("Manual refresh control missing");
            console.log("PASS: official source cards render NOAH-owned SVG cover with links, not scraped photos");
          '
      - name: Ensure refreshed feedback replaces the timestamp instead of adding a row
        run: |
          node --input-type=module -e '
            const fs=await import("node:fs");
            const view=fs.readFileSync("components/home/PublicSourceDesk.tsx","utf8");
            const css=fs.readFileSync("app/globals.css","utf8");
            if (!view.includes("aria-live=\"polite\"") || !view.includes("refreshStatus?.text ??")) throw Error("Status must appear inline in the timestamp area");
            if (view.includes("<p className=\"sourceRefreshStatus\"")) throw Error("Redundant second refresh message row returned");
            if (!view.includes("window.setTimeout(() => setRefreshStatus(null), 3000)")) throw Error("Missing 3-second transient reset");
            if (!css.includes("prefers-reduced-motion: reduce")) throw Error("Reduce-motion setting not respected");
            console.log("PASS: same-row 3-second feedback and accessible reduced-motion behavior");
          '
      - name: Check read-only manual refresh API and controlled failure
        run: |
          node --input-type=module -e '
            const r=await fetch("http://127.0.0.1:3110/api/sources/refresh");
            if (![200,503].includes(r.status)) throw Error("Refresh API must return attributed sources or honest upstream outage, got "+r.status);
            const data=await r.json();
            if(r.status===200 && (!Array.isArray(data.items)||data.availableFeeds<1||!data.retrievedAt)) throw Error("Refresh response missing verified source information");
            if(r.status===503 && !data.error) throw Error("Upstream outage was not marked");
            console.log("PASS manual refresh endpoint: "+r.status);
          '
      - if: always()
        run: |
          if test -f /tmp/noah-safe-cards.pid; then kill "$(cat /tmp/noah-safe-cards.pid)" || true; fi
